# Production stack for a small VPS (2 GB RAM / 2 vCPU):
#
#     docker compose -f compose.prod.yaml up -d --build
#
# Only Nginx publishes ports (80 and 443). The app services sit on private networks and
# Nginx can reach only the web frontend, never TrueForge (which holds the model key) or
# the MCP server. Every value comes from .env next to this file (see .env.production.example);
# unlike compose.yaml, no secrets/ directory is mounted, so .env is the only source.
# compose.yaml stays the localhost development setup.
name: verifyfirst-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Health checks spawn a Node process each time, so they run every 30 s once healthy but
# every 2 s during start-up so dependent services are not held back.
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 90s
  start_interval: 2s

x-runtime: &runtime
  build: .
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging
  networks:
    - app

x-application: &application
  TRUEFORGE_BASE_URL: http://trueforge:8790
  VERIFYFIRST_MCP_URL: http://mcp:8791/mcp
  VERIFYFIRST_DATA_DIR: /var/lib/verifyfirst/cases-data
  TRUEFORGE_MODEL: ${TRUEFORGE_MODEL:-}
  TRUEFORGE_SANDBOX: ${TRUEFORGE_SANDBOX:-auto}
  TRUEFORGE_SUBAGENTS: ${TRUEFORGE_SUBAGENTS:-true}

services:
  init:
    <<: *runtime
    command: [init]
    volumes:
      - cases:/var/lib/verifyfirst
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }

  trueforge:
    <<: *runtime
    command: [harness]
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      SQLITE_PATH: /var/lib/trueforge/trueforge.sqlite
      LOCAL_SANDBOX_ROOT_PARENT: /var/lib/trueforge/sandboxes
      LOG_LEVEL: warn
      NODE_OPTIONS: --max-old-space-size=320
    volumes:
      - harness:/var/lib/trueforge
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped
    stop_grace_period: 35s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  # Registers the model provider, the optional Daytona sandbox and the MCP connector in
  # TrueForge from .env on every start, so nothing is configured through the TrueForge UI.
  setup:
    <<: *runtime
    command: [setup]
    environment:
      <<: *application
      MODEL_PROVIDER: ${MODEL_PROVIDER:?set MODEL_PROVIDER in .env}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY in .env}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      NODE_OPTIONS: --max-old-space-size=128
    volumes:
      - cases:/var/lib/verifyfirst
    depends_on:
      init:
        condition: service_completed_successfully
      trueforge:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  mcp:
    <<: *runtime
    command: [mcp]
    environment:
      <<: *application
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8791
      IPQS_API_KEY: ${IPQS_API_KEY:-}
      NODE_OPTIONS: --max-old-space-size=128
    volumes:
      - cases:/var/lib/verifyfirst
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8791/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 320M }

  web:
    <<: *runtime
    command: [web]
    environment:
      <<: *application
      VERIFYFIRST_PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - cases:/var/lib/verifyfirst
    networks:
      - app
      - edge
    depends_on:
      setup:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  # Independent of the app: it must come up to answer the Let's Encrypt challenge even
  # while the app is still starting or failing.
  nginx:
    image: nginx:1.30.5-alpine
    entrypoint: [/bin/sh, /etc/nginx/verifyfirst/start.sh]
    init: true
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD in .env}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./deploy/nginx:/etc/nginx/verifyfirst:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-challenge:/var/www/certbot:ro
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 64M }

  certbot:
    image: certbot/certbot:v5.8.0
    entrypoint: [/bin/sh, /opt/verifyfirst/run.sh]
    init: true
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./deploy/certbot:/opt/verifyfirst:ro
      - letsencrypt:/etc/letsencrypt
      - acme-challenge:/var/www/certbot
    # Outbound only: it shares volumes with Nginx but no network with the app.
    networks:
      - certbot
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 192M }

networks:
  app:
  edge:
  certbot:

volumes:
  cases:
  harness:
  letsencrypt:
  acme-challenge:
