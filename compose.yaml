# No explicit image tag: Compose names built images per project, so two checkouts
# never overwrite each other's build. All services share one Dockerfile and build
# context, so the layers are built once and reused.
x-runtime: &runtime
  build: .
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Repository-relative, so it works identically on any machine. The directory always
# exists; a secret file inside it is optional and absent files are not an error.
x-secrets: &secrets
  type: bind
  source: ./secrets
  target: /run/secrets/verifyfirst
  read_only: true
  bind:
    create_host_path: false

x-application: &application
  TRUEFORGE_BASE_URL: http://trueforge:8790
  VERIFYFIRST_MCP_URL: http://mcp:8791/mcp
  VERIFYFIRST_DATA_DIR: /var/lib/verifyfirst/cases-data
  VERIFYFIRST_SECRETS_DIR: /run/secrets/verifyfirst
  TRUEFORGE_MODEL: ${TRUEFORGE_MODEL:-}
  TRUEFORGE_SANDBOX: ${TRUEFORGE_SANDBOX:-auto}
  TRUEFORGE_SUBAGENTS: ${TRUEFORGE_SUBAGENTS:-true}

services:
  init:
    <<: *runtime
    command: [init]
    volumes:
      - cases:/var/lib/verifyfirst

  trueforge:
    <<: *runtime
    command: [harness]
    environment:
      HOST: 0.0.0.0
      PORT: 8790
      SQLITE_PATH: /var/lib/trueforge/trueforge.sqlite
      LOCAL_SANDBOX_ROOT_PARENT: /var/lib/trueforge/sandboxes
      LOG_LEVEL: warn
    ports:
      - 127.0.0.1:8790:8790
    volumes:
      - harness:/var/lib/trueforge
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: on-failure
    stop_grace_period: 35s

  setup:
    <<: *runtime
    command: [setup]
    environment:
      <<: *application
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
    volumes:
      - cases:/var/lib/verifyfirst
      - *secrets
    depends_on:
      init:
        condition: service_completed_successfully
      trueforge:
        condition: service_healthy

  mcp:
    <<: *runtime
    command: [mcp]
    environment:
      <<: *application
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8791
      IPQS_API_KEY: ${IPQS_API_KEY:-}
    volumes:
      - cases:/var/lib/verifyfirst
      - *secrets
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8791/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure

  web:
    <<: *runtime
    command: [web]
    environment:
      <<: *application
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - cases:/var/lib/verifyfirst
      - *secrets
    depends_on:
      setup:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure

volumes:
  cases:
  harness:
